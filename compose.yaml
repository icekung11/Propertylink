services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: propertylink_db
      POSTGRES_USER: propertylink_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propertylink_dev -d propertylink_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
